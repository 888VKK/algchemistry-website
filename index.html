<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgChemistry — 100 & Above</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #ffffff;
      color: #17324d;
      font-family: Avenir, "Avenir Next", Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .content {
      transform: translateY(-2vh);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 5vw, 72px);
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .tagline {
      margin-top: 10px;
      font-family: "DM Sans", Avenir, Arial, sans-serif;
      font-size: clamp(18px, 1.8vw, 25px);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .coming-soon {
      margin-top: 72px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .contact {
      margin-top: 60px;
      font-size: 13px;
      line-height: 1.8;
    }

    .contact-label {
      font-weight: 600;
      margin-bottom: 4px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main>
    <div class="content">
      <h1>AlgChemistry</h1>
      <div class="tagline">100 &amp; Above</div>

      <div class="coming-soon">Coming Soon</div>

      <div class="contact">
        <div class="contact-label">Contact</div>
        <a href="mailto:info@algchemistry.com">info@algchemistry.com</a>
      </div>
    </div>
  </main>
</body>
</html>
